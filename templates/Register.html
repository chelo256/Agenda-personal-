<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro - Agenda Personal</title>
<style>
body { background:#0f0f0f; color:#fff; font-family:sans-serif; display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; }
.card { background:#1a1a1a; padding:32px; border-radius:16px; width:100%; max-width:380px; box-shadow:0 10px 30px rgba(0,0,0,0.5); }
h1 { margin:0 0 8px; font-size:22px; }
.sub { color:#888; font-size:14px; margin-bottom:20px; }
input { width:100%; padding:12px; margin:8px 0; background:#2a2a2a; border:1px solid #333; border-radius:8px; color:#fff; box-sizing:border-box; }
button { width:100%; padding:12px; background:#fff; color:#000; border:none; border-radius:8px; font-weight:bold; cursor:pointer; margin-top:12px; font-size:15px; }
.error { background:#ff3b30; padding:10px; border-radius:8px; margin-bottom:12px; font-size:14px; }
.link { text-align:center; margin-top:16px; font-size:13px; color:#888; }
.link a { color:#fff; text-decoration:underline; }
</style>
</head>
<body>
<div class="card">
<h1>Crear cuenta</h1>
<p class="sub">Tu agenda privada y segura</p>
{% if error %}<div class="error">{{ error }}</div>{% endif %}
<form method="POST">
<input type="text" name="username" placeholder="Usuario (ej: julio)" required>
<input type="email" name="email" placeholder="Correo" required>
<input type="password" name="password" placeholder="Contraseña (min 6 caracteres)" required minlength="6">
<input type="password" name="password2" placeholder="Repite contraseña" required>
<button type="submit">Registrarme</button>
</form>
<div class="link">¿Ya tienes cuenta? <a href="/login">Inicia sesión</a></div>
</div>
</body>
</html>
