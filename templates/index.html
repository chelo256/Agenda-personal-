<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Agenda Personal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #e3f2fd;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 18px;
            position: relative;
            word-wrap: break-word;
        }
        
        .message.user {
            background-color: #E3F2FD;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        
        .message.system {
            background-color: #ffffff;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }
        
        .message-content {
            font-size: 15px;
            line-height: 1.4;
        }
        
        .message-image {
            max-width: 100%;
            max-height: 250px;
            border-radius: 8px;
            margin-top: 8px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .message-image:hover {
            transform: scale(1.02);
        }
        
        .image-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
        
        .image-modal img {
            max-width: 90%;
            max-height: 90%;
            border-radius: 8px;
        }
        
        .image-modal.active {
            display: flex;
        }
        
        .message-meta {
            font-size: 11px;
            color: #999;
            margin-top: 4px;
            text-align: right;
        }
        
        .delete-btn {
            background-color: #dc3545;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 4px 8px;
            font-size: 12px;
            cursor: pointer;
            margin-top: 5px;
            transition: background-color 0.2s;
        }
        
        .delete-btn:hover {
            background-color: #c82333;
        }
        
        .evidence-id {
            font-size: 10px;
            color: #666;
            font-family: monospace;
            margin-top: 2px;
        }
        
        .input-area {
            background-color: #f0f0f0;
            padding: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .attach-btn {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background-color: #2196F3;
            color: white;
            border: none;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s;
        }
        
        .attach-btn:hover {
            background-color: #1976D2;
        }
        
        .message-input {
            flex: 1;
            border: none;
            border-radius: 24px;
            padding: 12px 20px;
            font-size: 15px;
            outline: none;
            background-color: white;
        }
        
        .send-btn {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background-color: #2196F3;
            color: white;
            border: none;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s;
        }
        
        .send-btn:hover {
            background-color: #1976D2;
        }
        
        .header {
            background-color: #1976D2;
            color: white;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .header-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #2196F3;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
        
        .header-info h3 {
            font-size: 18px;
            margin: 0;
            font-weight: 500;
        }
        
        .header-info p {
            font-size: 13px;
            margin: 2px 0 0 0;
            opacity: 0.8;
        }
        
        .typing-indicator {
            display: none;
            color: #666;
            font-size: 13px;
            padding: 5px 10px;
            font-style: italic;
        }
        
        .welcome-message {
            text-align: center;
            padding: 20px;
            color: #666;
        }
        
        .welcome-message h2 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #1976D2;
        }
        
        .hidden {
            display: none !important;
        }
        
        #image-input {
            display: none;
        }
        
        .preview-container {
            display: none;
            padding: 10px;
            background-color: #f0f0f0;
            border-radius: 12px;
            margin-bottom: 10px;
        }
        
        .preview-image {
            max-width: 100%;
            max-height: 200px;
            border-radius: 8px;
        }
        
        .remove-preview {
            position: absolute;
            top: 5px;
            right: 5px;
            background-color: rgba(0,0,0,0.5);
            color: white;
            border: none;
            border-radius: 50%;
            width: 25px;
            height: 25px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-avatar">�</div>
        <div class="header-info">
            <h3>Agenda Personal</h3>
            <p>Guarda y consulta tus registros</p>
        </div>
    </div>
    
    <div class="chat-container" id="chat-container">
        <div class="welcome-message">
            <h2>👋 Hola</h2>
            <p>Soy tu asistente para gestionar evidencias.</p>
            <p style="margin-top: 10px;">
                <strong>Usa el botón + para adjuntar imágenes</strong><br>
                <strong>Escribe comandos como:</strong><br>
                • "buscar [texto]" - Buscar evidencias<br>
                • "mostrar todo" - Ver todas las evidencias<br>
                • "estadísticas" - Ver resumen
            </p>
        </div>
    </div>
    
    <div class="typing-indicator" id="typing-indicator">
        Escribiendo...
    </div>
    
    <div class="preview-container" id="preview-container">
        <button class="remove-preview" onclick="removeImagePreview()">×</button>
        <img id="image-preview" class="preview-image" src="" alt="Preview">
    </div>
    
    <div class="input-area">
        <button class="attach-btn" onclick="document.getElementById('image-input').click()">+</button>
        <input type="file" id="image-input" accept="image/*" onchange="handleImageSelect(event)">
        <input type="text" class="message-input" id="message-input" placeholder="Escribe un mensaje..." onkeypress="handleKeyPress(event)">
        <button class="send-btn" onclick="sendMessage()">➤</button>
    </div>
    
    <!-- Modal para ver imagen completa -->
    <div class="image-modal" id="image-modal" onclick="closeImageModal()">
        <img id="modal-image" src="" alt="Imagen completa">
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let selectedImage = null;
        
        function addMessage(content, isUser = false, imageSrc = null) {
            const container = document.getElementById('chat-container');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user' : 'system'}`;
            
            let html = '<div class="message-content">' + content + '</div>';
            
            if (imageSrc) {
                html += `<img src="${imageSrc}" class="message-image" alt="Imagen adjunta">`;
            }
            
            html += '<div class="message-meta">' + new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) + '</div>';
            
            messageDiv.innerHTML = html;
            container.appendChild(messageDiv);
            container.scrollTop = container.scrollHeight;
        }
        
        function showTyping() {
            document.getElementById('typing-indicator').style.display = 'block';
        }
        
        function hideTyping() {
            document.getElementById('typing-indicator').style.display = 'none';
        }
        
        function handleImageSelect(event) {
            const file = event.target.files[0];
            if (file) {
                selectedImage = file;
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('image-preview').src = e.target.result;
                    document.getElementById('preview-container').style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        }
        
        function removeImagePreview() {
            selectedImage = null;
            document.getElementById('image-input').value = '';
            document.getElementById('preview-container').style.display = 'none';
        }
        
        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }
        
        async function sendMessage() {
            const input = document.getElementById('message-input');
            const message = input.value.trim();
            
            if (!message && !selectedImage) {
                return;
            }
            
            // Ocultar mensaje de bienvenida al primer mensaje
            const welcomeMessage = document.querySelector('.welcome-message');
            if (welcomeMessage) {
                welcomeMessage.remove();
            }
            
            // Mostrar mensaje del usuario
            if (message) {
                addMessage(message, true);
            }
            
            // Si hay imagen, subirla
            if (selectedImage) {
                await uploadImage(message);
            } else {
                // Procesar comando de texto
                await processCommand(message);
            }
            
            // Limpiar input
            input.value = '';
            removeImagePreview();
        }
        
        async function uploadImage(description) {
            showTyping();
            
            const formData = new FormData();
            formData.append('image', selectedImage);
            formData.append('description', description || 'Sin descripción');
            formData.append('problem_type', 'General');
            formData.append('project', 'Personal');
            formData.append('tags', '');
            
            try {
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (data.success) {
                    addMessage('✅ Imagen guardada exitosamente', false);
                    if (description) {
                        addMessage('Descripción: ' + description, false);
                    }
                } else {
                    addMessage('❌ Error al guardar: ' + data.error, false);
                }
            } catch (error) {
                addMessage('❌ Error de conexión: ' + error, false);
            }
            
            hideTyping();
        }
        
        async function processCommand(message) {
            showTyping();
            
            const lowerMessage = message.toLowerCase();
            
            try {
                // Comandos de búsqueda
                if (lowerMessage.startsWith('buscar ') || lowerMessage === 'buscar' ||
                    lowerMessage.startsWith('necesito buscar ') || lowerMessage.startsWith('busca ') ||
                    lowerMessage.startsWith('muéstrame ') || lowerMessage.startsWith('encuentra ') ||
                    lowerMessage.startsWith('quiero ver ') || lowerMessage.startsWith('encuentra ')) {
                    
                    let query = '';
                    if (lowerMessage.startsWith('buscar ')) {
                        query = lowerMessage.replace('buscar ', '').trim();
                    } else if (lowerMessage.startsWith('necesito buscar ')) {
                        query = lowerMessage.replace('necesito buscar ', '').trim();
                    } else if (lowerMessage.startsWith('busca ')) {
                        query = lowerMessage.replace('busca ', '').trim();
                    } else if (lowerMessage.startsWith('muéstrame ')) {
                        query = lowerMessage.replace('muéstrame ', '').trim();
                    } else if (lowerMessage.startsWith('encuentra ')) {
                        query = lowerMessage.replace('encuentra ', '').trim();
                    } else if (lowerMessage.startsWith('quiero ver ')) {
                        query = lowerMessage.replace('quiero ver ', '').trim();
                    } else if (lowerMessage === 'buscar') {
                        query = '';
                    }
                    
                    await searchEvidence(query);
                } 
                // Comandos de mostrar todo
                else if (lowerMessage === 'mostrar todo' || lowerMessage === 'todo' ||
                    lowerMessage === 'muéstrame todo' || lowerMessage === 'ver todo' ||
                    lowerMessage === 'todas las evidencias' || lowerMessage === 'todo mi trabajo') {
                    await showAllEvidence();
                } 
                // Comandos de estadísticas
                else if (lowerMessage === 'estadísticas' || lowerMessage === 'estadisticas' ||
                    lowerMessage === 'resumen' || lowerMessage === 'cómo voy' ||
                    lowerMessage === 'mi progreso' || lowerMessage === 'información') {
                    await showStats();
                } 
                // Comandos de eliminación
                else if (lowerMessage.startsWith('eliminar ') || lowerMessage.startsWith('borrar ') ||
                    lowerMessage.startsWith('quitar ') || lowerMessage.startsWith('borra ')) {
                    
                    let id = '';
                    if (lowerMessage.startsWith('eliminar ')) {
                        id = lowerMessage.replace('eliminar ', '').trim();
                    } else if (lowerMessage.startsWith('borrar ')) {
                        id = lowerMessage.replace('borrar ', '').trim();
                    } else if (lowerMessage.startsWith('quitar ')) {
                        id = lowerMessage.replace('quitar ', '').trim();
                    } else if (lowerMessage.startsWith('borra ')) {
                        id = lowerMessage.replace('borra ', '').trim();
                    }
                    
                    await deleteEvidence(id);
                } 
                // Comandos de ayuda
                else if (lowerMessage === 'ayuda' || lowerMessage === 'help' ||
                    lowerMessage === 'comandos' || lowerMessage === 'qué puedo hacer' ||
                    lowerMessage === 'opciones' || lowerMessage === '?') {
                    showHelp();
                } 
                // Respuestas conversacionales
                else if (lowerMessage.includes('necesito') || lowerMessage.includes('quiero')) {
                    addMessage('🤔 Entiendo que necesitas algo. ¿Podrías ser más específico? Puedo buscar evidencias, mostrarte todo tu trabajo, o darte estadísticas.', false);
                    addMessage('💡 Prueba con: "necesito buscar [texto]" o "quiero ver todo"', false);
                }
                else {
                    addMessage('💡 No estoy seguro de entender. Prueba con comandos como:', false);
                    addMessage('• "necesito buscar [texto]"', false);
                    addMessage('• "muéstrame todo"', false);
                    addMessage('• "resumen"', false);
                    addMessage('• "ayuda" para más opciones', false);
                }
            } catch (error) {
                addMessage('❌ Error: ' + error, false);
            }
            
            hideTyping();
        }
        
        async function searchEvidence(query) {
            const params = new URLSearchParams();
            if (query) params.append('query', query);
            
            const response = await fetch(`/search?${params}`);
            const data = await response.json();
            
            if (data.success && data.results.length > 0) {
                addMessage(`🔍 Encontré ${data.results.length} evidencia(s):`, false);
                
                for (const evidence of data.results) {
                    // Crear mensaje con imagen
                    const container = document.getElementById('chat-container');
                    const messageDiv = document.createElement('div');
                    messageDiv.className = 'message system';
                    
                    let html = `<div class="message-content">
                        <strong>📌 ${evidence.description.substring(0, 100)}...</strong><br>
                        <small>📅 ${new Date(evidence.date).toLocaleDateString()}</small>
                    </div>`;
                    
                    // Agregar imagen
                    html += `<img src="/image/${evidence.id}" class="message-image" alt="Evidencia" onclick="showFullImage('${evidence.id}')" style="cursor: pointer;">`;
                    
                    // Agregar ID y botón de eliminar
                    html += `<div class="evidence-id">ID: ${evidence.id.substring(0, 8)}...</div>`;
                    html += `<button class="delete-btn" onclick="deleteEvidence('${evidence.id}')">🗑️ Eliminar</button>`;
                    
                    if (evidence.cloud_provider !== 'local') {
                        html += `<div class="message-meta">☁️ ${evidence.cloud_provider}</div>`;
                    }
                    
                    messageDiv.innerHTML = html;
                    container.appendChild(messageDiv);
                    container.scrollTop = container.scrollHeight;
                }
            } else {
                addMessage('🔍 No encontré evidencias con ese criterio.', false);
            }
        }
        
        async function showAllEvidence() {
            const response = await fetch('/search');
            const data = await response.json();
            
            if (data.success && data.results.length > 0) {
                addMessage(`📂 Tienes ${data.results.length} evidencia(s) guardadas:`, false);
                
                data.results.forEach((evidence, index) => {
                    // Crear mensaje con imagen
                    const container = document.getElementById('chat-container');
                    const messageDiv = document.createElement('div');
                    messageDiv.className = 'message system';
                    
                    let html = `<div class="message-content">
                        <strong>${index + 1}. ${evidence.description.substring(0, 80)}...</strong><br>
                        <small>📅 ${new Date(evidence.date).toLocaleDateString()}</small>
                    </div>`;
                    
                    // Agregar imagen
                    html += `<img src="/image/${evidence.id}" class="message-image" alt="Evidencia" onclick="showFullImage('${evidence.id}')" style="cursor: pointer;">`;
                    
                    // Agregar ID y botón de eliminar
                    html += `<div class="evidence-id">ID: ${evidence.id.substring(0, 8)}...</div>`;
                    html += `<button class="delete-btn" onclick="deleteEvidence('${evidence.id}')">🗑️ Eliminar</button>`;
                    
                    messageDiv.innerHTML = html;
                    container.appendChild(messageDiv);
                    container.scrollTop = container.scrollHeight;
                });
            } else {
                addMessage('📂 Aún no tienes evidencias guardadas. Usa el botón + para agregar la primera.', false);
            }
        }
        
        async function showStats() {
            const response = await fetch('/stats');
            const data = await response.json();
            
            if (data.success) {
                const stats = data.stats;
                const statsText = `📊 Estadísticas:\n• Total: ${stats.total} evidencias\n• Proyectos: ${Object.keys(stats.by_project).length}`;
                addMessage(statsText, false);
            }
        }
        
        function showHelp() {
            const helpText = `📖 Comandos disponibles:\n\n🔍 BÚSQUEDA:\n• "necesito buscar [texto]"\n• "busca [texto]"\n• "muéstrame [texto]"\n• "quiero ver [texto]"\n\n📂 MOSTRAR:\n• "mostrar todo"\n• "muéstrame todo"\n• "ver todo"\n• "todas las evidencias"\n\n📊 ESTADÍSTICAS:\n• "resumen"\n• "cómo voy"\n• "mi progreso"\n\n🗑️ ELIMINAR:\n• "eliminar [id]"\n• "borrar [id]"\n\n➕ ADJUNTAR:\n• Usa el botón + para imágenes`;
            addMessage(helpText, false);
        }
        
        async function deleteEvidence(evidenceId) {
            try {
                const response = await fetch(`/evidence/${evidenceId}`, {
                    method: 'DELETE'
                });
                
                const data = await response.json();
                
                if (data.success) {
                    addMessage('✅ Evidencia eliminada correctamente', false);
                } else {
                    addMessage('❌ Error al eliminar: ' + data.error, false);
                }
            } catch (error) {
                addMessage('❌ Error de conexión: ' + error, false);
            }
        }
        
        function showFullImage(evidenceId) {
            const modal = document.getElementById('image-modal');
            const modalImage = document.getElementById('modal-image');
            modalImage.src = `/image/${evidenceId}`;
            modal.classList.add('active');
        }
        
        function closeImageModal() {
            const modal = document.getElementById('image-modal');
            modal.classList.remove('active');
        }
    </script>
</body>
</html>
